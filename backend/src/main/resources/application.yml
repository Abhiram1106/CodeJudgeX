spring:
  application:
    name: codejudgex

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/codejudgex}
    username: ${DB_USER:codejudgex}
    password: ${DB_PASS:secret}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    listener:
      simple:
        acknowledge-mode: manual
        retry:
          enabled: true
          max-attempts: 3

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    from: ${MAIL_FROM:noreply@codejudgex.local}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

server:
  port: 8080
  servlet:
    context-path: /api/v1

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /actuator
  metrics:
    export:
      prometheus:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-min-32-chars!!}
    access-token-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000}
    refresh-token-expiry-days: ${JWT_REFRESH_EXPIRY_DAYS:7}

  judge0:
    base-url: ${JUDGE0_URL:http://localhost:2358}
    token: ${JUDGE0_TOKEN:}
    poll-interval-ms: 1000
    max-poll-attempts: 30

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:80}

  rate-limit:
    submission-per-minute: 5
