services:
  postgres:
    image: postgres:16-alpine
    container_name: cjx-postgres
    environment:
      POSTGRES_DB: codejudgex
      POSTGRES_USER: codejudgex
      POSTGRES_PASSWORD: secret
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U codejudgex']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cjx-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: cjx-rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  judge0-db:
    image: postgres:13-alpine
    container_name: cjx-judge0-db
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0secret
    volumes:
      - judge0_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U judge0']
      interval: 5s
      timeout: 5s
      retries: 10

  judge0-redis:
    image: redis:7-alpine
    container_name: cjx-judge0-redis
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  judge0-server:
    image: judge0/judge0:1.13.1
    container_name: cjx-judge0-server
    ports:
      - '2358:2358'
    privileged: true
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      REDIS_HOST: judge0-redis
      DATABASE_HOST: judge0-db
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0secret

  judge0-workers:
    image: judge0/judge0:1.13.1
    container_name: cjx-judge0-workers
    command: ['./scripts/workers']
    privileged: true
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      REDIS_HOST: judge0-redis
      DATABASE_HOST: judge0-db
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0secret

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: cjx-backend
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/codejudgex
      DB_USER: codejudgex
      DB_PASS: secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
      JUDGE0_URL: http://judge0-server:2358
      JUDGE0_TOKEN: ${JUDGE0_TOKEN:-}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-min-32-chars!!}
      CORS_ORIGINS: http://localhost:80,http://localhost:5173
      MAIL_HOST: ${MAIL_HOST:-mailhog}
      MAIL_PORT: ${MAIL_PORT:-1025}

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: cjx-frontend
    ports:
      - '80:80'
    depends_on:
      - backend

  mailhog:
    image: mailhog/mailhog:latest
    container_name: cjx-mailhog
    ports:
      - '1025:1025'
      - '8025:8025'

  prometheus:
    image: prom/prometheus:latest
    container_name: cjx-prometheus
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: cjx-grafana
    ports:
      - '3001:3000'
    depends_on:
      - prometheus

volumes:
  postgres_data:
  judge0_pg_data:
